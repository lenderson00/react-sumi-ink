[package]
name = "sumi-ink-sim"
version = "0.1.0"
edition = "2021"
authors = ["Lenderson Macedo"]
license = "MIT"
description = "2D stable-fluids ink simulation for react-sumi-ink (WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1